<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Hedvig Letters Serif";
        src: url(../../public/fonts/hedvig-letters-serif-latin-400-normal.woff2) format("woff2");
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 660px;
        height: 428px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: linear-gradient(180deg, #161d3a 0, #2f3560 110px, #5f5f86 205px, #79718c 262px, #7d7088 303px, #141827 303px, #0e111c 428px);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .clouds,
      .grain {
        position: absolute;
        inset: 0;
      }
      .clouds {
        height: 230px;
        background: url(../../public/sky-dark.webp) top / 100% 100% no-repeat;
      }
      .grain {
        background: url(../../public/grain.png) 0 0 / 256px;
        opacity: 0.1;
        -webkit-mask-image: linear-gradient(#000 303px, rgb(0 0 0 / 0.45) 303px);
        mask-image: linear-gradient(#000 303px, rgb(0 0 0 / 0.45) 303px);
      }
      .brand {
        position: absolute;
        top: 38px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .brand svg {
        width: 34px;
        height: 34px;
        margin-top: -2px;
      }
      .brand h1 {
        margin: 0;
        font-family: "Hedvig Letters Serif", "New York", Georgia, serif;
        font-size: 27px;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .caption {
        position: absolute;
        top: 317px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgb(255 255 255 / 0.66);
        line-height: 1.7;
      }
      .caption b {
        font-weight: 500;
        color: rgb(255 255 255 / 0.92);
      }
    </style>
  </head>
  <body>
    <div class="clouds"></div>
    <svg class="scene" viewBox="0 0 660 428" width="660" height="428">
      <defs>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3b98c" />
          <stop offset="1" stop-color="#d98a6a" />
        </linearGradient>
        <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="396" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.7" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0.95" />
        </linearGradient>
      </defs>
      <path d="M268 196a60 60 0 0 1 120 0z" fill="url(#sun)" opacity="0.62" />
      <line x1="0" y1="303" x2="660" y2="303" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />
      <path d="M262 201.5H395M388.5 195.5C390.8 198 393 200 395 201.5C393 203 390.8 205 388.5 207.5" fill="none" stroke="url(#fade)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="grain"></div>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 15a7 7 0 0 1 14 0z" fill="currentColor" />
        <rect x="3" y="16.5" width="18" height="1.6" rx="0.8" fill="currentColor" />
      </svg>
      <h1>Midnight</h1>
    </div>
    <div class="caption">
      <b>Drag Midnight to Applications to install</b><br />
      Zum Installieren in den Programme-Ordner ziehen
    </div>
  </body>
</html>
