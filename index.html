<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight</title>
    <script src="/theme-init.js"></script>
    <link rel="preload" href="/fonts/hedvig-letters-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/hedvig-letters-serif-latin-400-normal.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html:not(.menubar-panel) {
        background: #f7f7f6;
      }
      html.dark:not(.menubar-panel) {
        background: #0b0b0b;
      }
      #splash {
        --splash-bg: #f7f7f6;
        --splash-fg: #111111;
        --splash-line: #e5e5e2;
        --splash-ease: cubic-bezier(0.16, 1, 0.3, 1);
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--splash-bg);
        color: var(--splash-fg);
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      .dark #splash {
        --splash-bg: #0b0b0b;
        --splash-fg: #f2f2f0;
        --splash-line: #262626;
      }
      .menubar-panel #splash {
        display: none;
      }
      #splash svg {
        width: 42px;
        height: 42px;
        overflow: visible;
      }
      #splash .sun {
        animation: splash-rise 1100ms var(--splash-ease) 80ms backwards;
      }
      #splash .horizon {
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-draw 700ms var(--splash-ease) backwards;
      }
      #splash .wordmark {
        margin: 0;
        font-family: "Hedvig Letters Serif", "New York", Georgia, serif;
        font-size: 46px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        animation: splash-in 900ms var(--splash-ease) 260ms backwards;
      }
      #splash .loader {
        position: absolute;
        bottom: 56px;
        width: 72px;
        height: 1px;
        overflow: hidden;
        background: var(--splash-line);
        animation: splash-fade 400ms ease-out 900ms backwards;
      }
      #splash .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: var(--splash-fg);
        opacity: 0.55;
        animation: splash-scan 1400ms ease-in-out 900ms infinite;
      }
      #splash.out {
        pointer-events: none;
        animation: splash-out 380ms ease-in forwards;
      }
      @keyframes splash-rise {
        from {
          transform: translateY(9px);
        }
      }
      @keyframes splash-draw {
        from {
          transform: scaleX(0.2);
          opacity: 0;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
          letter-spacing: 0.04em;
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-scan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
          transform: scale(1.015);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::after,
        #splash.out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" data-tauri-drag-region aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <defs>
          <clipPath id="splash-sky">
            <rect x="0" y="-12" width="24" height="28.5" />
          </clipPath>
        </defs>
        <g clip-path="url(#splash-sky)">
          <path class="sun" d="M5 15a7 7 0 0 1 14 0z" fill="currentColor" />
        </g>
        <rect class="horizon" x="3" y="16.5" width="18" height="1.6" rx="0.8" fill="currentColor" />
      </svg>
      <h1 class="wordmark">Midnight</h1>
      <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
