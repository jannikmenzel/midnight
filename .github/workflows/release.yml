name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const changelog = require('fs').readFileSync('CHANGELOG.md', 'utf8')
            const section = changelog.split('\n## ').find((s) => s.startsWith(`[${tag.replace(/^v/, '')}]`))
            const notes = section ? section.slice(section.indexOf('\n') + 1).trim() : ''
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Midnight ${tag}`,
              body: notes || `See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
            })
            core.setOutput('id', data.id)
            core.setOutput('notes', notes)

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party notices
        run: |
          scripts/third_party_notices.sh "$RUNNER_TEMP/THIRD_PARTY_NOTICES.txt"
          printf '{"bundle":{"createUpdaterArtifacts":true,"resources":{"%s":"THIRD_PARTY_NOTICES.txt"}}}' "$RUNNER_TEMP/THIRD_PARTY_NOTICES.txt" > "$RUNNER_TEMP/notices.conf.json"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: --target ${{ matrix.target }} --config ${{ runner.temp }}/notices.conf.json
