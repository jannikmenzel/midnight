name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const changelog = require('fs').readFileSync('CHANGELOG.md', 'utf8')
            const section = changelog.split('\n## ').find((s) => s.startsWith(`[${tag.replace(/^v/, '')}]`))
            const notes = section ? section.slice(section.indexOf('\n') + 1).trim() : ''
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Midnight ${tag}`,
              body: notes || `See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for details.`,
              draft: true,
            })
            core.setOutput('id', data.id)
            core.setOutput('notes', notes)

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party notices
        run: |
          scripts/third_party_notices.sh "$RUNNER_TEMP/THIRD_PARTY_NOTICES.txt"
          node -e '
            const [dir] = process.argv.slice(1)
            const notices = require("path").join(dir, "THIRD_PARTY_NOTICES.txt")
            const config = { bundle: { createUpdaterArtifacts: true, resources: { [notices]: "THIRD_PARTY_NOTICES.txt" } } }
            require("fs").writeFileSync(require("path").join(dir, "notices.conf.json"), JSON.stringify(config))
          ' "$RUNNER_TEMP"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: --target ${{ matrix.target }} --config ${{ runner.temp }}/notices.conf.json
