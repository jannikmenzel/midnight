name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-latest
    env:
      SAMPLES: ${{ github.workspace }}/e-invoice-samples
      VALIDATORS: ${{ github.workspace }}/e-invoice-validators
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Write sample e-invoices
        working-directory: src-tauri
        env:
          EINVOICE_SAMPLES: ${{ env.SAMPLES }}
        run: cargo test --locked writes_validation_samples -- --ignored

      - name: Download validators
        run: |
          mkdir -p "$VALIDATORS/xrechnung"
          curl -fsSL -o "$VALIDATORS/kosit.jar" https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
          curl -fsSL -o "$VALIDATORS/xrechnung.zip" https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
          unzip -q "$VALIDATORS/xrechnung.zip" -d "$VALIDATORS/xrechnung"
          curl -fsSL -o "$VALIDATORS/mustang.jar" https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar

      - name: Validate XRechnung (KoSIT, XRechnung 3.0.2)
        run: java -jar "$VALIDATORS/kosit.jar" -s "$VALIDATORS/xrechnung/scenarios.xml" -r "$VALIDATORS/xrechnung" -o "$VALIDATORS/reports" "$SAMPLES"/*-xrechnung.xml

      - name: Validate ZUGFeRD (Mustang, veraPDF)
        run: |
          for pdf in "$SAMPLES"/*-zugferd.pdf; do
            report="${pdf%.pdf}-report.xml"
            java -jar "$VALIDATORS/mustang.jar" --action validate --source "$pdf" --no-notices > "$report" || { cat "$report"; exit 1; }
          done
